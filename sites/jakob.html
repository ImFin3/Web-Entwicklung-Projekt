<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jakob</title>
  <link rel="stylesheet" href="../style/style.css">
</head>
<body onload="checkLogin(); renderTasks('jakob'); ensureEditModalExists()">

  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="marian.html">Marian</a>
    <a href="lenny.html">Lenny</a>
    <a href="jakob.html">Jakob</a>
    <a href="jean.html">Jean</a>
    <button class="dark-mode-btn" onclick="toggleDarkMode()">Dark Mode</button>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </nav>

  <main>
    <h1>Jakob's Aufgaben</h1>

    <div id="taskInputArea"></div>

    <h2>Offene Aufgaben</h2>
    <div id="openTasks"></div>

    <h2>Erledigte Aufgaben</h2>
    <div id="doneTasks"></div>
  </main>

  <script src="../script/main.js"></script>

  <script>
    if (canEdit("jakob")) {
      document.getElementById("taskInputArea").innerHTML = `
        <div class="card">
          <input id="taskText" type="text" placeholder="Neue Aufgabe">

          <div class="add-task-flex-wrapper">
            <label for="taskProgress">
              Fortschritt: <span id="progressValue">0%</span>
            </label>
            <input
              id="taskProgress"
              type="range"
              min="0"
              max="100"
              value="0"
              oninput="updateProgressValue()"
            >

            <button class="add-btn" onclick="addTask('jakob')">Hinzufügen</button>
          </div>
        </div>
      `;
    }
  </script>

</body>
</html>
