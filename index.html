<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="style/style.css">
</head>

<body>
  <main class="center">
    <div class="card">
      <h1>Login</h1>
      <button onclick="toggleDarkMode()" style="margin-bottom: 20px; width: 100%;">Dark Mode</button>

      <form id="loginForm">
        <input type="text" id="username" placeholder="Name" required>
        <input type="text" id="password" placeholder="Passwort" required>
        <button type="submit">Login</button>
      </form>

      <p id="error"></p>
    </div>
  </main>
  
  <script src="script/main.js"></script>
</body>
</html>
